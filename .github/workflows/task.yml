name: Scheduled task
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validation only
        type: boolean
        default: false
  schedule:
    - cron: '4-59/5 * * * *'

permissions:
  contents: read

concurrency:
  group: scheduled-task
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
  collect:
    if: github.event_name != 'push' && (vars.COLLECTOR_ENABLED == 'true' || inputs.dry_run)
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: public-source-cache-v1-${{ github.run_id }}
          restore-keys: public-source-cache-v1-
      - name: Run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          COLLECTOR_KEY: ${{ secrets.COLLECTOR_KEY }}
          MATCHING_RULES: ${{ secrets.MATCHING_RULES }}
          JOB_TIMEZONE: Asia/Kolkata
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        shell: bash
        run: |
          if [ "$DRY_RUN" = 'true' ]; then
            python -m collector.run --dry-run --limit 40 --seconds 100
          else
            python -m collector.run
          fi
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: .cache
          key: public-source-cache-v1-${{ github.run_id }}
